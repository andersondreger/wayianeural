services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wayianeural-web
    restart: unless-stopped
    environment:
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?defina no .env}
    networks:
      - wayia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/app/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: wayia-net
      traefik.http.routers.wayianeural.entrypoints: web,websecure
      traefik.http.routers.wayianeural.rule: Host(`wayia.com.br`)
      traefik.http.routers.wayianeural.tls: "true"
      traefik.http.routers.wayianeural.tls.certresolver: leresolver
      traefik.http.services.wayianeural.loadbalancer.server.port: "80"
      # http://wayia.com.br/... -> https (sem isso o http cai no 404 do Traefik, ex.: redirects antigos guardados no navegador)
      traefik.http.routers.wayianeural-http.entrypoints: web
      traefik.http.routers.wayianeural-http.rule: Host(`wayia.com.br`)
      traefik.http.routers.wayianeural-http.middlewares: wayianeural-https
      traefik.http.middlewares.wayianeural-https.redirectscheme.scheme: https
      traefik.http.middlewares.wayianeural-https.redirectscheme.permanent: "true"

  payments-api:
    build:
      context: ./payments-api
    container_name: wayianeural-payments
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina no .env}
      AUTH_SECRET: ${AUTH_SECRET:?defina no .env}
      REST_URL: http://wayianeural-rest:3000
      APP_URL: https://wayia.com.br
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AVATAR_DIR: /data/avatars
      ASAAS_API_KEY: ${ASAAS_API_KEY:?defina no .env}
      ASAAS_API_BASE_URL: ${ASAAS_API_BASE_URL:-https://sandbox.asaas.com/api/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?defina no .env}
      PAY_SERVICE_TOKEN: ${PAY_SERVICE_TOKEN:?defina no .env}
      PAY_SERVICE_TOKENS: ${PAY_SERVICE_TOKENS:-}
      HANDOFF_SECRET: ${HANDOFF_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?defina no .env}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?defina no .env}
      SUPPORT_EVO_INSTANCE: ${SUPPORT_EVO_INSTANCE:-nucleo}
      SUPPORT_WHATSAPP_TO: ${SUPPORT_WHATSAPP_TO:-}
      BELA360_API_URL: ${BELA360_API_URL:-https://bela360.wayia.com.br/api}
      MARKETPLACE_SERVICE_TOKEN: ${MARKETPLACE_SERVICE_TOKEN:-}
    volumes:
      - avatars:/data/avatars
    depends_on:
      - rest
    networks:
      - wayia-net

  # PostgREST: API REST sobre o Postgres do wayianeural (usada só pelo payments-api, rede interna).
  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: wayianeural-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: ${DATABASE_URL:?defina no .env}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${AUTH_SECRET:?defina no .env}
    networks:
      - wayia-net

volumes:
  avatars:

networks:
  wayia-net:
    external: true
