services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wayianeural-web
    restart: unless-stopped
    environment:
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?defina no .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?defina no .env}
    networks:
      - wayia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/app/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: wayia-net
      traefik.http.routers.wayianeural.entrypoints: web,websecure
      traefik.http.routers.wayianeural.rule: Host(`wayia.com.br`)
      traefik.http.routers.wayianeural.tls: "true"
      traefik.http.routers.wayianeural.tls.certresolver: leresolver
      traefik.http.services.wayianeural.loadbalancer.server.port: "80"

  payments-api:
    build:
      context: ./payments-api
    container_name: wayianeural-payments
    restart: unless-stopped
    environment:
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?defina no .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?defina no .env}
      ASAAS_API_KEY: ${ASAAS_API_KEY:?defina no .env}
      ASAAS_API_BASE_URL: ${ASAAS_API_BASE_URL:-https://sandbox.asaas.com/api/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?defina no .env}
      PAY_SERVICE_TOKEN: ${PAY_SERVICE_TOKEN:?defina no .env}
      PAY_SERVICE_TOKENS: ${PAY_SERVICE_TOKENS:-}
      HANDOFF_SECRET: ${HANDOFF_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?defina no .env}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?defina no .env}
      SUPPORT_EVO_INSTANCE: ${SUPPORT_EVO_INSTANCE:-nucleo}
      SUPPORT_WHATSAPP_TO: ${SUPPORT_WHATSAPP_TO:-}
    networks:
      - wayia-net

networks:
  wayia-net:
    external: true
